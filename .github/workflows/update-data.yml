name: Update FRAGGRID data

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this slightly during busy periods.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated data files

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest esports data
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: node scripts/fetch-data.js

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "fraggrid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --quiet --cached || git commit -m "Update live data"
          git push
